name: gitmago
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_svg: ^2.0.17
  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.1
  flutter_web_auth: ^0.6.0
  webview_flutter: ^4.11.0
  uni_links: ^0.5.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/icons/comment/
    - assets/icons/home/
    - assets/icons/user/
    - assets/test/

  fonts:
    - family: SUITE
      fonts:
        - asset: assets/fonts/SUITE-Heavy.otf
          weight: 700
        - asset: assets/fonts/SUITE-ExtraBold.otf
          weight: 600
        - asset: assets/fonts/SUITE-Bold.otf
          weight: 500
        - asset: assets/fonts/SUITE-SemiBold.otf
          weight: 400
        - asset: assets/fonts/SUITE-Medium.otf
          weight: 300
        - asset: assets/fonts/SUITE-Regular.otf
          weight: 200
        - asset: assets/fonts/SUITE-Light.otf
          weight: 100